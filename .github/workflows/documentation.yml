name: Documentation

on:
  pull_request:
    branches: [main, 'game/**']
  push:
    branches: [main, 'game/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.9'
          python-version: '3.13'
          enable-cache: false
      - name: Test documentation tools
        run: uv run --project tools/docs --locked python -m unittest discover -s tools/docs
      - name: Build the full site with the proposed pages
        env:
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          args=()
          if [[ "$TARGET_BRANCH" == game/* ]]; then
            python3 tools/docs/sync_shared.py check
            args+=(--game "${TARGET_BRANCH#game/}")
          fi
          uv run --project tools/docs --locked python tools/docs/site.py build "${args[@]}"
